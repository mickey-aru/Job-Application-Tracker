<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo">JT</span>
        <div>
          <h1>Job Application Tracker</h1>
          <p>Keep every application in one place</p>
        </div>
      </div>
      <button id="open-modal" class="primary">+ Add Application</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="overview">
      <div class="card">
        <h2>Status Overview</h2>
        <div class="chart-wrap">
          <div class="donut" id="donut"><div class="donut-center"><strong id="donut-total">0</strong><span>Total</span></div></div>
          <ul class="legend" id="legend"></ul>
        </div>
      </div>
      <div class="card">
        <h2>Key Numbers</h2>
        <div class="kpis" id="kpis"></div>
      </div>
    </section>

    <section class="card">
      <div class="table-head">
        <h2>All Applications</h2>
        <div class="filters">
          <input id="search" placeholder="Search by company">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option>Applied</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Company</th><th>Role</th><th>Applied on</th><th>Status</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
      <p id="empty" hidden>No applications found.</p>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <form id="app-form" class="modal-box">
      <h2 id="form-title">Add Application</h2>
      <input type="hidden" id="app-id">
      <label>Company *<input id="company" required></label>
      <label>Role *<input id="role" required></label>
      <label>Job link<input id="job_url" type="url" placeholder="https://"></label>
      <div class="row">
        <label>Applied on *<input id="applied_date" type="date" required></label>
        <label>Status
          <select id="status">
            <option>Applied</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select>
        </label>
      </div>
      <label>Notes<textarea id="notes" rows="3"></textarea></label>
      <p id="error" class="error"></p>
      <div class="buttons">
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        <button type="submit" id="submit-btn" class="primary">Add</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
